<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Links</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
background: #2b2b2b;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #ffff;
            text-align: center;
            margin: 30px 0;
            font-weight: 600;
        }

        main {
            flex-grow: 1;
            padding: 20px;
        }

        section {
            margin-bottom: 30px;
        }

        .category-title {
            color: #3b5bdb;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #ddd;
            font-weight: 500;
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Reduced minmax */
            grid-gap: 15px; /* Reduced gap */
        }

        li {
position:relative;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08); /* Reduced shadow */
            overflow: hidden;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            height: 120px; /* Reduced height */
        }

        li:hover {
            transform: translateY(-3px); /* Reduced lift */
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.1); /* Reduced shadow on hover */
        }

        .link-image {
            width: 100%;
            height: 100%; /* Reduced image height */
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        a {
position:absolute;
width:100%;
height:100%;
left:0;
top:0;
background:rgba(0, 0, 0, 0.444);

            display: flex;
            align-items: center;
            padding: 10px; /* Reduced padding */
            text-decoration: none;
            color: rgba(51, 51, 51, 0.238);
            flex-grow: 1;
            font-size: 0.9em; /* Slightly smaller font */
        }

        .link-text {
            font-weight: 500;
            color:#fff;
            z-index: 1000;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            ul {
                grid-template-columns: 1fr;
            }
            body {
                margin: 0;
            }

            h1 {
                font-size: 1.5em;
                margin: 20px 0;
            }

            a {
                padding: 10px;
                font-size: 0.9em;
            }

            .link-image {
                height: 50px;
            }
            li{
              height: auto;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
